<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>業務割合グラフ</title>
    <link rel="stylesheet" th:href="@{/css/analytics.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
	<div class="container">
		<h1>業務割合</h1>
    
		<!-- 期間絞り込みフォーム -->
		<form th:action="@{/daily-log/analytics}" method="get" class="search-form">
			<div class="form-group">
				<label for="startDate">開始日:</label>
				<input type="date" id="startDate" name="startDate" th:value="${startDate}">
			</div>
			<div class="form-group">
				<label for="endDate">終了日:</label>
			    <input type="date" id="endDate" name="endDate" th:value="${endDate}">
			</div>
			<button type="submit" class="btn-search">絞り込む</button>
		</form>
		
		<div class="chart-container">
			<!-- th:data-* 属性でコントローラーからの変数を設定 -->
			<canvas id="categoryChart" 
			        th:data-labels="${chartLabels}" 
			        th:data-values="${chartData}">
			</canvas>
		</div>
	
		<div class="actions">
			<a th:href="@{/daily-log/list}" class="btn">一覧画面に戻る</a>
		</div>
	</div>
	
	<script th:src="@{/js/analytics.js}"></script>

</body>
</html>
