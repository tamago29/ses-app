<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>日報一覧 - 日報管理アプリ</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/list.css}">
</head>
<body>

    <h1>日報一覧</h1>
	
	<div class="text-end mb-3">
		<a th:href="@{/daily-log/register}" class="btn btn-link">日報新規登録</a>
		<a th:href="@{/daily-log/category-list}" class="btn btn-link">カテゴリ編集</a>
		<a th:href="@{/daily-log/analytics}" class="btn btn-link">業務割合グラフ</a>
	</div>
	
	<div class="log-board">
		<form th:action="@{/daily-log/delete}" method="post">
		    <div th:each="entry : ${groupedLogs}" class="log-card">
		        <div class="d-flex justify-content-between align-items-center">
					
					<div class="d-flex align-items-center gap-2">
			            <span class="date" th:text="${entry.key}"></span>
			            
			            <th:block th:each="log : ${entry.value}">
			                <span class="category" th:text="${log.taskCategory.name}"></span>
							<span class="time" th:text="|${log.workHours}h|"></span>					
			            </th:block>
					</div>
					
						<button type="submit" name="delete" th:value="${entry.key}" class="btn btn-danger btn-sm" onclick="return confirm('本当に削除しますか？');">
							削除 
					    </button>
		        </div>
		    </div>
		</form>
	</div>

	<div th:if="${#maps.isEmpty(groupedLogs)}" style="color: #666;">
	    まだ日報が登録されていません。
	</div>
</body>
</html>
