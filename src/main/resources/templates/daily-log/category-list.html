<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>カテゴリ - 日報管理アプリ</title>
	<link rel="stylesheet" th:href="@{/css/category-list.css}">
</head>
<body>

    <h1>カテゴリ編集</h1>

    <div class="form-container">
        
        <form th:action="@{/daily-log/category-list}" th:object="${categoryForm}" method="post">
              
            <table border="1">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>カテゴリ</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="category, stat : *{categories}">
                        <td>
                            <input type="hidden" th:field="*{categories[__${stat.index}__].id}" />
                            <input type="text" th:field="*{categories[__${stat.index}__].no}" 
							       readonly 
								   class="category-input readonly-mode" style="width: 40px;" />
								   <!-- エラーメッセージ表示 -->
								   <span th:if="${#fields.hasErrors('categories[' + stat.index + '].no')}" 
								             th:errors="*{categories[__${stat.index}__].no}">
								   </span>
                        </td>
                        <td>
                            <!-- 初期状態では readonly と readonly-mode クラスを付与 -->
                            <input type="text" 
                                   th:field="*{categories[__${stat.index}__].name}" 
                                   readonly
                                   class="category-input readonly-mode" 
                                   placeholder="カテゴリ名を入力" />
                        </td>
						<!-- 削除ボタン列 -->
						<td class="action-column is-hidden">
							<button type="submit" name="delete_id" th:value="${category.id}" class="btn btn-danger btn-sm" 
							onclick="return confirm('本当に削除しますか？');">
							削除 
						    </button>
						</td>
                    </tr>
                </tbody>
            </table>

            <br>
            
            <!-- 閲覧モード用のボタン -->
            <a th:href="@{/daily-log/list}" id="btn-back" class="btn btn-secondary">戻る</a>
            <button type="button" id="btn-edit-mode" class="btn btn-edit">編集</button>

            <!-- 編集モード用のボタン（初期表示は非表示） -->
            <button type="submit" id="btn-add" class="btn is-hidden" name="add">追加</button>
            <button type="submit" id="btn-save" class="btn is-hidden" name="save">保存</button>
            <button type="button" id="btn-cancel" class="btn btn-secondary is-hidden">キャンセル</button>

        </form>
    </div>
	
	<script th:src="@{/js/category-list.js}"></script>
	
</body>
</html>
